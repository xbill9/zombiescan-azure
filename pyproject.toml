[project]
name = "zombiescan-azure"
version = "0.1.0"
description = "Find the Azure resources nobody is using, and what they cost you."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # There is no Azure SDK here on purpose. Credentials come from the `az`
    # CLI and every call goes to one REST surface -- Azure Resource Manager --
    # so a new check needs an api-version entry rather than a new dependency.
    # The azure-mgmt-* libraries would each bring their own client shape and
    # their own pagination idiom, which the generic Step runner in clean.py
    # could not drive. HTTP is urllib from the standard library.
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/xbill9/zombiescan-azure"
Repository = "https://github.com/xbill9/zombiescan-azure"
Issues = "https://github.com/xbill9/zombiescan-azure/issues"

[project.scripts]
zombiescan = "zombiescan.cli:main"
# The MCP server behind the Claude Code plugin. Same engine, same
# read-only guarantee; it speaks JSON-RPC over stdio instead of to a terminal.
zombiescan-mcp = "zombiescan.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zombiescan"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits a real Azure subscription; requires ZOMBIESCAN_LIVE=1"]
